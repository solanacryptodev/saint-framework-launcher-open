[package]
name = "saint-framework-launcher-open"
version = "0.1.0"
description = "A launcher for a text-based game client"
authors = ["Brian Lewis"]
edition = "2021"
default-run = "saint-framework-launcher-open"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "saint_framework_launcher_open_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "saint-framework-launcher-open"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
mistralrs = { git = "https://github.com/EricLBuehler/mistral.rs.git" }
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread"] }
tokio-stream = "0.1"
futures = "0.3"
once_cell = "1.18"
anyhow = "1.0"
parking_lot = "0.12"
tracing = "0.1"
rand = "0.8"
indexmap = "2"
either = "1.15.0"

[profile.dev]
# Reduce codegen units to lower memory usage during compilation
codegen-units = 4
# Disable incremental to reduce memory pressure
incremental = false
# Don't optimize, but limit memory
opt-level = 0

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 2
panic = "abort"
strip = true
